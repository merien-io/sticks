[package]
name = "sticks"
version = "1.0.0-draft"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "fs", "io-util"] }
tokio-stream = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = { version = "2.9", features = ["json"] }
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
toml = "0.8"
mime_guess = "2.0"
clap = { version = "4.5", features = ["derive"] }
percent-encoding = "2.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true